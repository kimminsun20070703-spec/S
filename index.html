<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A-Frame Space Planets</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script>
      AFRAME.registerComponent("starfield", {
        init: function () {
          var group = document.createElement("a-entity");
          for (var i = 0; i < 500; i += 1) {
            var star = document.createElement("a-sphere");
            var radius = 70;
            var phi = Math.random() * Math.PI * 2;
            var costheta = Math.random() * 2 - 1;
            var theta = Math.acos(costheta);
            var x = radius * Math.sin(theta) * Math.cos(phi);
            var y = radius * Math.sin(theta) * Math.sin(phi);
            var z = radius * Math.cos(theta);

            star.setAttribute("position", x + " " + y + " " + z);
            star.setAttribute("radius", 0.06 + Math.random() * 0.06);
            star.setAttribute("color", "#ffffff");
            star.setAttribute("material", "shader: flat; emissive: #ffffff; emissiveIntensity: 1;");
            group.appendChild(star);
          }
          this.el.appendChild(group);
        },
      });
    </script>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #020617;
      }
    </style>
  </head>
  <body>
    <a-scene>
      <a-assets timeout="1500">
        <img id="bg-img" src="background.jpg" />
        <a-asset-item id="deer-model" src="Deer.glb"></a-asset-item>
        <a-asset-item id="sweet-model" src="gino_48-sweet-3255.glb"></a-asset-item>
        <a-asset-item id="snowman-model" src="pixellabs-snowman-3549.glb"></a-asset-item>
        <a-asset-item id="star-model" src="wings_of_freedom-star-3056.glb"></a-asset-item>
        <a-asset-item id="gift-model" src="gift-157.glb"></a-asset-item>
      </a-assets>

      <!-- 360 배경 이미지 -->
      <a-sky src="#bg-img" rotation="0 -90 0"></a-sky>

      <a-entity starfield></a-entity>

      <!-- 조명 -->
      <a-entity light="type: ambient; color: #ffffff; intensity: 1.2"></a-entity>
      <a-entity
        light="type: directional; color: #ffffff; intensity: 1.5"
        position="2 4 4"
      ></a-entity>
      <a-entity
        light="type: point; color: #ffeedd; intensity: 1.5; distance: 90"
        position="0 6 6"
      ></a-entity>

      <a-entity id="camera-rig" position="0 1.6 0">
        <a-camera position="0 0 0"></a-camera>

        <!-- 사슴 1 (기존 주황색 구 궤도 - 속도 반으로 감속) -->
        <a-entity
          animation="property: rotation; to: 0 360 0; loop: true; dur: 9000; easing: linear;"
        >
          <a-entity
            gltf-model="#deer-model"
            position="2.8 0 0"
            scale="0.2 0.2 0.2"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 4400; easing: linear;"
          ></a-entity>
        </a-entity>

        <!-- 사슴 2 (기울기 14도 - 속도 반으로 감속) -->
        <a-entity
          rotation="14 0 0"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 14000; easing: linear;"
        >
          <a-entity
            gltf-model="#deer-model"
            position="4.2 -0.1 0"
            scale="0.2 0.2 0.2"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear;"
          ></a-entity>
        </a-entity>

        <!-- 사슴 3 (기울기 -10도 - 속도 반으로 감속) -->
        <a-entity
          rotation="-10 0 0"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 20400; easing: linear;"
        >
          <a-entity
            gltf-model="#deer-model"
            position="5.6 0.35 0"
            scale="0.2 0.2 0.2"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 7600; easing: linear;"
          ></a-entity>
        </a-entity>

        <!-- 사슴 4 (대각선 입체 궤도 - 속도 반으로 감속) -->
        <a-entity
          rotation="25 45 10"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 11600; easing: linear;"
        >
          <a-entity
            gltf-model="#deer-model"
            position="3.6 -0.2 0"
            scale="0.2 0.2 0.2"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 5200; easing: linear;"
          ></a-entity>
        </a-entity>

        <!-- 사슴 5 (크기 2배 대형 사슴 A) -->
        <a-entity
          rotation="-20 120 0"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 16000; easing: linear;"
        >
          <a-entity
            gltf-model="#deer-model"
            position="4.8 0 0"
            scale="0.4 0.4 0.4"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 6800; easing: linear;"
          ></a-entity>
        </a-entity>

        <!-- 사슴 6 (크기 2배 대형 사슴 B) -->
        <a-entity
          rotation="35 -60 15"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 22000; easing: linear;"
        >
          <a-entity
            gltf-model="#deer-model"
            position="6.6 -0.4 0"
            scale="0.4 0.4 0.4"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear;"
          ></a-entity>
        </a-entity>

        <!-- Sweet 1 (gino_48-sweet-3255.glb) -->
        <a-entity
          rotation="5 70 0"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 13000; easing: linear;"
        >
          <a-entity
            gltf-model="#sweet-model"
            position="3.2 0.3 0"
            scale="0.02 0.02 0.02"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear;"
          ></a-entity>
        </a-entity>

        <!-- Sweet 2 (gino_48-sweet-3255.glb) -->
        <a-entity
          rotation="-15 -110 5"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 17000; easing: linear;"
        >
          <a-entity
            gltf-model="#sweet-model"
            position="5.0 -0.4 0"
            scale="0.025 0.025 0.025"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 6500; easing: linear;"
          ></a-entity>
        </a-entity>

        <!-- Snowman 1 (pixellabs-snowman-3549.glb) -->
        <a-entity
          rotation="20 -30 -10"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear;"
        >
          <a-entity
            gltf-model="#snowman-model"
            position="2.4 -0.2 0"
            scale="0.8 0.8 0.8"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 4800; easing: linear;"
          ></a-entity>
        </a-entity>

        <!-- Snowman 2 (pixellabs-snowman-3549.glb) -->
        <a-entity
          rotation="-30 80 20"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 19000; easing: linear;"
        >
          <a-entity
            gltf-model="#snowman-model"
            position="5.8 0.5 0"
            scale="0.9 0.9 0.9"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 7500; easing: linear;"
          ></a-entity>
        </a-entity>

        <!-- Star 1 (wings_of_freedom-star-3056.glb) -->
        <a-entity
          rotation="40 150 -15"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 15000; easing: linear;"
        >
          <a-entity
            gltf-model="#star-model"
            position="4.0 0.4 0"
            scale="0.75 0.75 0.75"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear;"
          ></a-entity>
        </a-entity>

        <!-- Star 2 (wings_of_freedom-star-3056.glb) -->
        <a-entity
          rotation="-10 -160 0"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 23000; easing: linear;"
        >
          <a-entity
            gltf-model="#star-model"
            position="7.2 0 0"
            scale="1.0 1.0 1.0"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 8500; easing: linear;"
          ></a-entity>
        </a-entity>

        <!-- Gift 1 (gift-157.glb) -->
        <a-entity
          rotation="15 -140 10"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 11000; easing: linear;"
        >
          <a-entity
            gltf-model="#gift-model"
            position="3.0 0.1 0"
            scale="0.35 0.35 0.35"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 4200; easing: linear;"
          ></a-entity>
        </a-entity>

        <!-- Gift 2 (gift-157.glb) -->
        <a-entity
          rotation="-25 25 -15"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 15500; easing: linear;"
        >
          <a-entity
            gltf-model="#gift-model"
            position="4.5 -0.3 0"
            scale="0.4 0.4 0.4"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 5800; easing: linear;"
          ></a-entity>
        </a-entity>

        <!-- Gift 3 (gift-157.glb) -->
        <a-entity
          rotation="10 110 5"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 21000; easing: linear;"
        >
          <a-entity
            gltf-model="#gift-model"
            position="6.2 0.3 0"
            scale="0.32 0.32 0.32"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 7200; easing: linear;"
          ></a-entity>
        </a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
